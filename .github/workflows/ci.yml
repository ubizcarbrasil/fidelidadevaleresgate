name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário pra gitleaks comparar com história completa
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: RLS migration lint
        # Detecta tabelas novas com ENABLE RLS mas sem CREATE POLICY
        # (deny-all efetivo). Allowlist em scripts/lint-rls-migrations.ts
        # pra tabelas service-role-only legítimas.
        run: npx tsx scripts/lint-rls-migrations.ts

      - name: Run tests with coverage
        # Thresholds em vitest.config.ts. CI quebra se cair abaixo.
        # Threshold atual é baseline (~4%); sobe a cada quarter.
        run: npm test -- --coverage

      - name: Upload coverage artifact
        # Mesmo se test falhar, sobe o relatório pra análise offline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    # Roda em paralelo ao test job. Falha de security NÃO bloqueia
    # build (continue-on-error), mas aparece em vermelho no PR e
    # gera report no Security tab.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret scan
        # Detecta chaves/tokens/credenciais que vazaram no commit.
        # Allowlist opcional em `.gitleaks.toml`.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
